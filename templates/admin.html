<!DOCTYPE html>
<html>
<head><title>Admin Panel</title></head>
<link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">


<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f1f5f9;
        color: #1e293b;
        margin: 0;
        padding: 30px;
    }

    h1, h2, h3 {
        color: #1e3a5f;
    }

    h2 {
        margin-bottom: 20px;
    }

    a {
        color: #3157a4;
        text-decoration: none;
        margin: 8px;
    }

    a:hover {
        text-decoration: underline;
    }

    form, .container, .card {
        background: white;
        max-width: 750px;
        margin: 25px auto;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    input, select, textarea {
        width: 100%;
        padding: 12px;
        margin: 8px 0 15px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
    }

    button {
        background: #3157a4;
        color: white;
        padding: 12px 20px;
        border: none;
        border-radius: 7px;
        cursor: pointer;
    }

    button:hover {
        background: #1e3a70;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        margin-top: 20px;
    }

    th, td {
        padding: 13px;
        border: 1px solid #e2e8f0;
        text-align: left;
    }

    th {
        background: #3157a4;
        color: white;
    }

    tr:nth-child(even) {
        background: #f8fafc;
    }
</style>

<body>
  <h2>Admin Panel</h2>

  {% with messages = get_flashed_messages() %}
    {% for m in messages %}
      <p style="color:darkblue"><b>{{ m }}</b></p>
    {% endfor %}
  {% endwith %}

  <h3>Database Backups</h3>
  <form method="POST" action="/admin/backup">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit">Backup now</button>
  </form>

  <ul>
    {% for b in backups %}
      <li>{{ b }}</li>
    {% else %}
      <li>No backups yet</li>
    {% endfor %}
  </ul>

  <p><a href="/audit">View Audit Log</a></p>
  <a href="/dashboard">Back to dashboard</a>
</body>
</html>
